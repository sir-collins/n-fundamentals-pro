services:
  postgres:
    image: postgres:16-alpine
    container_name: n-fundamentals-postgres
    environment:
      POSTGRES_USER: nestjs
      POSTGRES_PASSWORD: nestjs
      POSTGRES_DB: n_fundamentals
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # No auth on the container itself — matches the same local-dev-only
  # pragmatism as postgres's own simple, non-production credentials above.
  mongo:
    image: mongo:7
    container_name: n-fundamentals-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
